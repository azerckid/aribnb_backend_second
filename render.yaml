services:
  # Django Web Service
  - type: web
    name: airbnb-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/v1/
    envVars:
      # Django 설정
      - key: SECRET_KEY
        sync: false  # Render 대시보드에서 수동으로 설정 필요
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        generateValue: true  # Render가 자동으로 도메인 생성
      
      # 데이터베이스 (PostgreSQL 서비스 참조)
      - key: DATABASE_URL
        fromDatabase:
          name: airbnb-db
          property: connectionString
      
      # CORS 설정 (프론트엔드 도메인 - 배포 후 업데이트 필요)
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # 프론트엔드 배포 후 수동 설정
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # 프론트엔드 배포 후 수동 설정
      
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # OAuth - GitHub
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      
      # OAuth - Kakao
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false

  # PostgreSQL Database
  - type: pg
    name: airbnb-db
    region: singapore
    plan: free
    databaseName: airbnb
    postgresMajorVersion: 16

